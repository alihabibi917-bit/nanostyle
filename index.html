<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NanoStyle AI Studio</title>
    <!-- منبع برای رابطه کاربری تاریک Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Vazirmatn', sans-serif; }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex flex-col justify-between p-4">

    <!-- هدر اپ -->
    <header class="text-center py-6">
        <h1 class="text-2xl font-bold tracking-wider text-amber-400">NanoStyle AI Studio</h1>
        <p class="text-xs text-zinc-400 mt-1">استودیو هوشمند ویرایش تصویر و شبکه اجتماعی</p>
    </header>

    <!-- بخش اصلی (آپلود و ابزارها) -->
    <main class="space-y-4 max-w-md mx-auto w-full">
        <!-- کادر آپلود عکس -->
        <div id="uploadBox" class="border-2 border-dashed border-zinc-700 bg-zinc-900/50 rounded-2xl p-6 text-center cursor-pointer hover:border-amber-500 transition relative overflow-hidden">
            
            <!-- آیکون و متن اولیه -->
            <div id="placeholderContent">
                <svg class="w-12 h-12 mx-auto text-amber-400 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                </svg>
                <p class="text-sm text-zinc-300">تصویر خود را برای ویرایش هوش مصنوعی بارگذاری کنید</p>
            </div>

            <!-- پیش‌نمایش تصویر انتخاب شده -->
            <img id="imagePreview" class="hidden w-full max-h-56 object-contain rounded-xl mx-auto mb-2 shadow-md" alt="Preview">

            <input type="file" id="fileInput" accept="image/*" class="hidden">
            <button type="button" id="selectBtn" class="mt-4 bg-amber-500 hover:bg-amber-600 text-zinc-950 font-semibold px-6 py-2.5 rounded-xl transition-all shadow-lg text-sm">انتخاب عکس</button>
        </div>

        <!-- ابزارهای سریع -->
        <div class="grid grid-cols-2 gap-3">
            <button type="button" id="proBtn" class="bg-zinc-900 border border-zinc-800 p-4 rounded-xl text-right hover:border-amber-500/50 transition cursor-pointer">
                <span class="block text-amber-400 font-bold text-sm">بهبود کیفیت پرو</span>
                <span class="text-[10px] text-zinc-400">افزایش کنتراست و وضوح</span>
            </button>
            <button type="button" id="instaBtn" class="bg-zinc-900 border border-zinc-800 p-4 rounded-xl text-right hover:border-amber-500/50 transition cursor-pointer">
                <span class="block text-amber-400 font-bold text-sm">استایل اینستاگرام</span>
                <span class="text-[10px] text-zinc-400">فیلتر گرم و مدرن</span>
            </button>
        </div>
    </main>

    <!-- فوتر -->
    <footer class="text-center py-4 text-xs text-zinc-600">
        نسخه ۱.۰.۰ | طراحی شده برای کافه بازار
    </footer>

    <!-- کدهای جاوا اسکریپت مبتنی بر Canvas برای اعمال قطعی فیلترها -->
    <script>
        const fileInput = document.getElementById('fileInput');
        const uploadBox = document.getElementById('uploadBox');
        const selectBtn = document.getElementById('selectBtn');
        const placeholderContent = document.getElementById('placeholderContent');
        const imagePreview = document.getElementById('imagePreview');
        const proBtn = document.getElementById('proBtn');
        const instaBtn = document.getElementById('instaBtn');

        let imageLoaded = false;
        let currentOriginalUrl = '';

        function openGallery(e) {
            if (e) e.stopPropagation();
            fileInput.click();
        }

        uploadBox.onclick = openGallery;
        selectBtn.onclick = openGallery;

        // بارگذاری عکس
        fileInput.onchange = function(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    currentOriginalUrl = e.target.result;
                    imagePreview.src = currentOriginalUrl;
                    imagePreview.classList.remove('hidden');
                    placeholderContent.classList.add('hidden');
                    selectBtn.textContent = 'تغییر عکس';
                    imageLoaded = true;
                }
                reader.readAsDataURL(file);
            }
        };

        // پردازش واقعی تصویر از طریق Canvas
        function processImage(filterFunction, successMsg) {
            if (!imageLoaded) {
                alert('لطفاً ابتدا یک عکس انتخاب کنید!');
                return;
            }

            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement('canvas');
                canvas.width = img.width;
                canvas.height = img.height;
                const ctx = canvas.getContext('2d');
                
                // رسم تصویر اصلی روی بوم
                ctx.drawImage(img, 0, 0);

                // اعمال پردازش پیکسلی
                const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                filterFunction(imgData.data);
                ctx.putImageData(imgData, 0, 0);

                // جایگزینی تصویر جدید با اعمال افکت
                imagePreview.src = canvas.toDataURL('image/jpeg');
                alert(successMsg);
            };
            img.src = currentOriginalUrl;
        }

        // دکمه بهبود کیفیت پرو (افزایش کنتراست و تقویت رنگ‌ها)
        proBtn.onclick = function() {
            processImage(function(data) {
                for (let i = 0; i < data.length; i += 4) {
                    // افزایش روشنایی و کنتراست پیکسل‌ها
                    data[i] = Math.min(255, data[i] * 1.15);     // Red
                    data[i+1] = Math.min(255, data[i+1] * 1.15); // Green
                    data[i+2] = Math.min(255, data[i+2] * 1.15); // Blue
                }
            }, 'ابزار بهبود کیفیت پرو روی تصویر اعمال شد!');
        };

        // دکمه استایل اینستاگرام (اعمال طیف رنگ گرم و جذاب)
        instaBtn.onclick = function() {
            processImage(function(data) {
                for (let i = 0; i < data.length; i += 4) {
                    // تقویت رنگ طلایی/قرمز برای افکت اینستاگرامی
                    data[i] = Math.min(255, data[i] * 1.2);      // Red (Warmth)
                    data[i+2] = Math.max(0, data[i+2] * 0.85);   // Blue decrease
                }
            }, 'استایل اینستاگرام روی تصویر اعمال شد!');
        };
    </script>
</body>
</html>
