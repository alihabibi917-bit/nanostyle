<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NanoStyle AI Studio</title>
    <!-- منبع برای رابطه کاربری تاریک Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Vazirmatn', sans-serif; }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex flex-col justify-between p-4">

    <!-- هدر اپ -->
    <header class="text-center py-6">
        <h1 class="text-2xl font-bold tracking-wider text-amber-400">NanoStyle AI Studio</h1>
        <p class="text-xs text-zinc-400 mt-1">استودیو هوشمند ویرایش تصویر و شبکه اجتماعی</p>
    </header>

    <!-- بخش اصلی (آپلود و ابزارها) -->
    <main class="space-y-4 max-w-md mx-auto w-full">
        <!-- کادر آپلود عکس -->
        <div id="uploadBox" class="border-2 border-dashed border-zinc-700 bg-zinc-900/50 rounded-2xl p-6 text-center cursor-pointer hover:border-amber-500 transition">
            <svg class="w-12 h-12 mx-auto text-amber-400 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
            </svg>
            <p class="text-sm text-zinc-300">تصویر خود را برای ویرایش هوش مصنوعی بارگذاری کنید</p>
            <input type="file" id="fileInput" accept="image/*" class="hidden">
            <button onclick="document.getElementById('fileInput').click();" class="mt-4 bg-amber-500 hover:bg-amber-600 text-zinc-950 font-semibold px-6 py-2.5 rounded-xl transition-all shadow-lg text-sm">انتخاب عکس</button>
        </div>

        <!-- ابزارهای سریع -->
        <div class="grid grid-cols-2 gap-3">
            <button onclick="alert('ابزار بهبود کیفیت پرو فعال شد!')" class="bg-zinc-900 border border-zinc-800 p-4 rounded-xl text-right hover:border-amber-500/50 transition">
                <span class="block text-amber-400 font-bold text-sm">بهبود کیفیت پرو</span>
                <span class="text-[10px] text-zinc-400">افزایش وضوح و رفع نویز</span>
            </button>
            <button onclick="alert('استایل اینستاگرام فعال شد!')" class="bg-zinc-900 border border-zinc-800 p-4 rounded-xl text-right hover:border-amber-500/50 transition">
                <span class="block text-amber-400 font-bold text-sm">استایل اینستاگرام</span>
                <span class="text-[10px] text-zinc-400">تنظیم نور و فیلتر مدرن</span>
            </button>
        </div>
    </main>

    <!-- فوتر -->
    <footer class="text-center py-4 text-xs text-zinc-600">
        نسخه ۱.۰.۰ | طراحی شده برای کافه بازار
    </footer>

    <!-- کدهای جاوا اسکریپت برای عملکرد دکمه‌ها -->
    <script>
        const fileInput = document.getElementById('fileInput');
        fileInput.addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (file) {
                alert('تصویر با موفقیت انتخاب شد: ' + file.name);
            }
        });
    </script>
</body>
</html>
